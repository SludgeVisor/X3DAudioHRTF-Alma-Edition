name: Build (Win32)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    env:
      DXSDK_DIR: 'C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)\'

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      # The DirectX SDK (June 2010) installer fails with error S1023 when a newer Visual C++ 2010 redistributable
      # is present (KB2728613). The product codes below are the x86 and x64 ones from that article.
      - name: Remove Visual C++ 2010 redistributables
        shell: pwsh
        continue-on-error: true
        run: |
          foreach ($code in '{F0C3E5D1-1ADE-321E-8167-68EF0DE699A5}', '{1D8E6291-B0D5-35EC-8441-6616F567A0F7}') {
            Start-Process msiexec.exe -ArgumentList "/x $code /qn /norestart" -Wait
          }

      - name: Install DirectX SDK (June 2010)
        shell: pwsh
        run: |
          choco install directx-sdk -y --no-progress
          if (-not (Test-Path "$env:DXSDK_DIR\Include\xaudio2.h")) {
            throw "DirectX SDK was not installed to $env:DXSDK_DIR"
          }

      # The project files target v141 / SDK 10.0.15063 (VS 2017). Runners have newer tools, so override them.
      - name: Build
        shell: pwsh
        run: >
          msbuild x3daudio1_7.sln /m
          /p:Configuration=Release /p:Platform=x86
          /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0

      - name: Collect files
        shell: pwsh
        run: |
          $out = 'package'
          New-Item -ItemType Directory -Force $out | Out-Null
          $dll = Get-ChildItem -Recurse -Filter x3daudio1_7.dll | Where-Object { $_.FullName -match 'Win32\\Release' } | Select-Object -First 1
          if (-not $dll) { throw 'x3daudio1_7.dll was not produced' }
          Copy-Item $dll.FullName $out
          Copy-Item patches\x3daudio_hrtf.ini.sample $out
          Copy-Item patches\README_PATCHES.txt $out

      - uses: actions/upload-artifact@v4
        with:
          name: x3daudio_hrtf_win32
          path: package
